{% extends 'base.html' %}
{% block conteudo %}
<form action="{{url_for('criar_atividade')}}" method="post">
<h1>Criar</h1>
<label>
    Matéria da atividade:
<input name="form_nome" type="text">
</label>
<br>
<br>
<label>
    Data de entrega:
    <input name="form_data" type="date">
</label>
<br>
<br>
Tipo :
<br>
<label>
    <input name="form_tipo" value="sozinho" type="radio">
     Sozinho
</label>
<br>
<label>
    <input name="form_tipo" value="dupla" type="radio">
     Dupla
</label>
<br>
<label>
    <input name="form_tipo" value="indeterminado" type="radio">
     Indeterminado
</label>
<br>
<br>
    <label for="form_professor">
        Professor:
        <br>
        <input name="form_professor" value="lucas" type="checkbox"> Lucas
        <input name="form_professor" value="luciano" type="checkbox"> Luciano

    </label>
    <br>
    <br>
<label>
    Objetivo :
    <br>
        <textarea name="form_objetivo" rows="5" cols="20"></textarea>
</label>
<br>
<br>
<button submit> Salvar</button>
<button reset> Redefinir</button>
</form>
{{dados_atividade_criar}}<br>
{% for atividade in dados_atividade_criar %}
{{atividade.nome}}<br>
{{atividade.professor}}
{% endfor %}
{% endblock conteudo %}
